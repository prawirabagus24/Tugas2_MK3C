<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <form class="login-container">

        <!-- Judul -->
        <h1>Login</h1>

        <p class="welcome">
            Selamat datang kembali!
        </p>

        <!-- Logo -->
        <img
            src="Assets/logo login/logo.singa.png"
            alt="Logo"
            class="logo"
        >

        <!-- Username -->
        <label for="username">
            Nama Pengguna
        </label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Masukkan username"
            required
        >

        <!-- Password -->
        <label for="password">
            Kata Sandi
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Masukkan kata sandi"
            required
        >

        <!-- Lupa Password -->
        <div class="forgot">
            <a href="#">Lupa kata sandi?</a>
        </div>

        <!-- Tombol -->
        <button type="submit">
            Login
        </button>

        <!-- Daftar -->
        <p class="register">
            Belum memiliki akun?
            <a href="#">Daftar Sekarang</a>
        </p>

    </form>

</body>

</html>
